version: "3.8"

services:
  drowsyguard-ai:
    build: .
    container_name: drowsyguard-automotive
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    devices:
      - "/dev/video0:/dev/video0" # Optional USB webcam passthrough on Linux
